apiVersion: batch/v1
kind: CronJob
metadata:
  name: heartbeat
  labels:
    app.kubernetes.io/name: heartbeat
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  # Suspending is an operator toggle (kubectl patch), not a Git setting:
  # the Argo CD Applications ignore drift on spec.suspend.
  suspend: false
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 60
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: heartbeat
        spec:
          serviceAccountName: heartbeat
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: report
              # Same image as the API; pinned to a digest by k8s/overlays/live.
              image: ghcr.io/rudyrod3/rudyrod-platform
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "app.report"]
              env:
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: HMAC_KEY
                  valueFrom:
                    secretKeyRef:
                      # Created by hand per namespace; never committed.
                      name: heartbeat
                      key: HMAC_KEY
                - name: STATUS_API_URL
                  valueFrom:
                    configMapKeyRef:
                      name: showcase-config
                      key: STATUS_API_URL
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 96Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
