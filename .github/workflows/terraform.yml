# Terraform: plan on pull requests (read-only role, posted as a PR comment), apply on main
# behind manual approval in the `aws` GitHub environment.
name: terraform

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Never cancel an apply halfway; queue instead.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  TF_VERSION: 1.17.1
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}
  # Set the repo variable to -1 while the account's Lambda concurrency limit is 10.
  TF_VAR_lambda_reserved_concurrency: ${{ vars.LAMBDA_RESERVED_CONCURRENCY || '2' }}

defaults:
  run:
    working-directory: infra/terraform

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # On pushes, diff against the previous commit of this branch. Without this the
          # action diffs against the default branch (staging), which after a promotion
          # equals main, so nothing on main would ever count as changed.
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          filters: |
            infra:
              - 'infra/terraform/**'
              - 'status_api/**'
              - '.github/workflows/terraform.yml'

  plan:
    name: Terraform plan
    needs: changes
    # Skipped (and so passing) when nothing Terraform-related changed.
    if: github.event_name == 'pull_request' && needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # AWS OIDC (read-only plan role)
      pull-requests: write # plan comment
    env:
      TF_VAR_budget_email: ${{ secrets.BUDGET_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TF_PLAN_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform fmt -check -recursive
      - run: terraform init -backend-config="bucket=$TF_VAR_state_bucket"
      - run: terraform validate
      # -lock=false: the plan role is read-only, so it can't write the S3 lock file.
      - run: terraform plan -lock=false -no-color -out tfplan
      - name: Post the plan on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "#### Terraform plan for \`${GITHUB_SHA::7}\`"
            echo '<details><summary>'"$(terraform show -no-color tfplan | grep -E '^(Plan:|No changes)' || echo 'Plan')"'</summary>'
            echo
            echo '```'
            terraform show -no-color tfplan | tail -c 60000
            echo '```'
            echo '</details>'
          } > plan.md
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file plan.md

  apply:
    name: Terraform apply
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    # Required reviewer + main-only deployment branch policy are set on this environment.
    environment: aws
    permissions:
      contents: read
      id-token: write # AWS OIDC (apply role trusts only environment:aws)
    env:
      TF_VAR_budget_email: ${{ secrets.BUDGET_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TF_APPLY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform init -backend-config="bucket=$TF_VAR_state_bucket"
      - run: terraform plan -no-color -out tfplan
      - run: terraform apply -no-color tfplan
