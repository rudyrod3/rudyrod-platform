# Keeps pinned versions current. PRs target staging, like every other change.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    target-branch: staging
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directories: ["/", "/app"]
    target-branch: staging
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: terraform
    directory: /infra/terraform
    target-branch: staging
    schedule:
      interval: weekly
